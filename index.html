<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="1;url=https://fjordloop.com">
<title>Redirecting...</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }

  .dot {
    opacity: 0;
    animation: blink 1.4s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }
</style>
</head>
<body>
  Redirecting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
<script>
  setTimeout(function () {
    window.location.replace("https://fjordloop.com");
  }, 1000);
</script>
</body>
</html>
